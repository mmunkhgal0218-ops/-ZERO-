
<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mongol Novel</title>
<style>
body{background:#10131c;color:#eee;font-family:Arial,sans-serif;margin:0}
header{text-align:center;padding:24px;background:#202638}
h1{color:#9bbcff}
main{max-width:700px;margin:auto;padding:16px}
input{width:100%;box-sizing:border-box;padding:13px;border-radius:8px}
.card{background:#202638;padding:16px;border-radius:12px;margin:16px 0}
a{color:#a9c5ff}
.chapter{display:block;padding:12px 0;border-top:1px solid #3a4357}
</style>
</head>
<body>
<header>
<h1>📚 Mongol Novel</h1>
<p>Үнэгүй зохиолын сан</p>
</header>
<main>
<input id="search" placeholder="Novel хайх..." oninput="findNovel()">
<div class="card">
<h2>Alice's Adventures in Wonderland</h2>
<p>Алисын гайхалтай адал явдал — англи хэл дээрх сонгодог зохиол.</p>
<a href="https://www.gutenberg.org/ebooks/11">Зохиолыг нээх</a>
<h3>Бүлгүүд</h3>
<a class="chapter" href="https://www.gutenberg.org/files/11/11-h/11-h.htm#chap01">Chapter 1 — Down the Rabbit-Hole</a>
<a class="chapter" href="https://www.gutenberg.org/files/11/11-h/11-h.htm#chap02">Chapter 2 — The Pool of Tears</a>
<a class="chapter" href="https://www.gutenberg.org/files/11/11-h/11-h.htm#chap03">Chapter 3 — A Caucus-Race</a>
</div>
</main>
<script>
function findNovel(){
let q=document.getElementById('search').value.toLowerCase();
document.querySelectorAll('.card').forEach(c=>{
c.style.display=c.innerText.toLowerCase().includes(q)?'block':'none';
});
}
</script>
</body>
</html>
