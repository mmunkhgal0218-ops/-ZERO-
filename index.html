<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Зохиолын булан</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;700&family=Noto+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f1ec;--s1:#fff;--s2:#ebe8e0;--ink:#161b28;--muted:#626b7c;--line:#dcd8cc;--ac:#a8721a;--acink:#fff;--glow:rgba(168,114,26,.12);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#070a11;--s1:#0f1521;--s2:#182033;--ink:#e9edf5;--muted:#8f99ad;--line:#232d42;--ac:#e5ac45;--acink:#1a1204;--glow:rgba(229,172,69,.14);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#070a11;--s1:#0f1521;--s2:#182033;--ink:#e9edf5;--muted:#8f99ad;--line:#232d42;--ac:#e5ac45;--acink:#1a1204;--glow:rgba(229,172,69,.14);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Noto Sans",system-ui,sans-serif}
h1,h2,h3,.serif{font-family:"Noto Serif",Georgia,serif;margin:0}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top{display:flex;align-items:center;gap:8px;padding:10px 0;flex-wrap:wrap}
.logo{font-family:"Noto Serif",Georgia,serif;font-weight:700;font-size:1.2rem;margin-right:auto;background:none;border:0;padding:0}
.logo b{color:var(--ac)}
nav{display:flex;gap:2px;flex-wrap:wrap}
nav button{background:none;border:0;padding:7px 11px;border-radius:99px;color:var(--muted);font-size:.93rem}
nav button[aria-current="page"]{background:var(--s2);color:var(--ink)}
.btn{background:var(--s1);border:1px solid var(--line);border-radius:10px;padding:8px 14px}
.btn.pri{background:var(--ac);color:var(--acink);border-color:var(--ac);font-weight:600}
.btn.del{color:#e0584e;border-color:#e0584e}
.btn:disabled{opacity:.4}
.hero{position:relative;min-height:330px;margin:16px 0 22px;border-radius:16px;overflow:hidden;display:flex;align-items:flex-end;color:#fff;transition:background .6s}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(5,8,14,.92),rgba(5,8,14,.15) 70%)}
.hin{position:relative;padding:22px;max-width:600px}
.hin small{color:#f0c36a;font-weight:600}
.hin h2{font-size:clamp(1.6rem,6vw,2.5rem);line-height:1.2;margin:4px 0 8px}
.hin p{margin:0 0 14px;opacity:.88;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.dots{position:absolute;right:16px;bottom:16px;display:flex;gap:6px}
.dots button{width:9px;height:9px;border-radius:50%;border:0;padding:0;background:rgba(255,255,255,.4)}
.dots button[aria-current="true"]{background:#f0c36a}
.types{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:26px}
.tile{background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:left}
.tile b{display:block}.tile span{color:var(--muted);font-size:.85rem}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:6px 0 12px}
.sec h3{font-size:1.15rem}
.link{background:none;border:0;color:var(--ac);padding:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:18px 14px;margin-bottom:30px}
.card{background:none;border:0;padding:0;text-align:left}
.poster{aspect-ratio:2/3;border-radius:10px;position:relative;overflow:hidden;color:#fff;display:flex;align-items:flex-end;padding:12px;font-family:"Noto Serif",Georgia,serif;font-weight:700;line-height:1.25;box-shadow:inset 0 -70px 50px -20px rgba(0,0,0,.55)}
.badge{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.55);font:600 .72rem "Noto Sans",sans-serif;padding:3px 8px;border-radius:99px}
.card .m{margin-top:7px;font-size:.86rem}.card .m b{display:block;font-weight:600}.card .m span{color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px}
.chip{flex:none;background:var(--s1);border:1px solid var(--line);border-radius:99px;padding:5px 14px;font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--ac);color:var(--acink);border-color:var(--ac)}
.bar2{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 10px}
.in{flex:1;min-width:180px;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--s1)}
.empty{grid-column:1/-1;color:var(--muted);padding:24px 0}
.det{display:grid;grid-template-columns:200px 1fr;gap:22px;margin:20px 0}
.det h2{font-size:1.8rem;margin-bottom:6px}
.meta{color:var(--muted);margin-bottom:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.chl{border-top:1px solid var(--line)}
.chl button{display:flex;justify-content:space-between;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 4px;text-align:left}
.chl .done{color:var(--muted)}.chl .last{color:var(--ac);font-weight:600}
.rank{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:16px;margin:16px 0;background-image:radial-gradient(circle at 100% 0,var(--glow),transparent 60%)}
.rank h3{color:var(--ac)}
.meter{height:6px;background:var(--s2);border-radius:9px;margin-top:10px;overflow:hidden}.meter i{display:block;height:100%;background:var(--ac)}
dialog{border:0;padding:0;width:min(720px,100%);height:100dvh;max-height:100dvh;background:var(--bg);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.6)}
.dbar{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top,0px));background:var(--s1);border-bottom:1px solid var(--line)}
.sp{flex:1;text-align:center;font-size:.9rem;color:var(--muted);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.read{padding:24px 22px 70px;font-family:"Noto Serif",Georgia,serif;line-height:1.9}
.read h3{color:var(--ac);margin:0 0 14px}.read p{margin:0 0 1em}
.pager{display:flex;justify-content:space-between;margin-top:28px}
.admin{padding:16px 16px 70px;display:grid;gap:12px}
.admin label{display:grid;gap:4px;font-size:.88rem;color:var(--muted)}
.admin input,.admin select,.admin textarea{padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--s1);width:100%}
.admin textarea{min-height:180px}.admin input[type=color]{padding:2px;height:42px}
.item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.note{color:var(--muted);font-size:.86rem;margin:0}.msg{color:var(--ac);min-height:1.2em;margin:0}
footer{border-top:1px solid var(--line);color:var(--muted);text-align:center;font-size:.85rem;padding:20px 0 30px}
@media(max-width:560px){.det{grid-template-columns:1fr}.det .poster{max-width:180px}}
@media(prefers-reduced-motion:reduce){.hero{transition:none}}
.stat-g{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{background:var(--s1);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}.stat b{display:block;font-size:1.4rem;color:var(--ac)}.stat span{font-size:.76rem;color:var(--muted)}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.acts .btn{padding:5px 9px;font-size:.82rem}
.admin fieldset{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:10px;margin:0}.admin legend{padding:0 6px;color:var(--ac);font-weight:600}
.chk{display:flex!important;align-items:center;gap:8px;grid-template-columns:none}.chk input{width:auto!important}
header{backdrop-filter:blur(10px)}
.card .poster{transition:transform .2s,box-shadow .2s}.card:hover .poster{transform:translateY(-3px);box-shadow:0 10px 24px rgba(0,0,0,.35),inset 0 -70px 50px -20px rgba(0,0,0,.55)}
.sec h3{border-left:3px solid var(--ac);padding-left:10px}
.hero{box-shadow:0 18px 50px -20px var(--glow)}

/* Mongol Novel visual refresh */
:root{--bg:#080d19;--s1:#111a2b;--s2:#1b2740;--ink:#f1f4ff;--muted:#9ca9c3;--line:#283652;--ac:#8875ff;--acink:#fff;--glow:rgba(115,91,255,.22);color-scheme:dark}
body{background:radial-gradient(ellipse at 82% -12%,rgba(77,93,194,.2),transparent 38%),var(--bg)}
.wrap{max-width:1240px;padding-left:clamp(14px,3vw,30px);padding-right:clamp(14px,3vw,30px)}
header{background:rgba(8,13,25,.88);backdrop-filter:blur(18px);border-bottom-color:rgba(120,143,190,.18)}
.top{padding:14px 0;gap:12px}
.logo{font-size:1.35rem;letter-spacing:-.035em}.logo b{color:#a99bff}
nav{gap:5px}nav button{padding:9px 13px;color:#b5c0d8}nav button[aria-current="page"]{background:linear-gradient(135deg,#6d5ce7,#4a5ed6);color:#fff;box-shadow:0 6px 20px rgba(91,82,226,.23)}
.btn{background:rgba(20,30,50,.88);border-color:#344362;border-radius:12px;transition:transform .18s,border-color .18s,background .18s}.btn:hover{transform:translateY(-1px);border-color:#8d80ff}.btn.pri{background:linear-gradient(135deg,#8170ff,#5368e8);border-color:transparent;box-shadow:0 8px 22px rgba(99,88,236,.24)}
.hero{min-height:clamp(290px,37vw,440px);margin:22px 0 26px;border:1px solid rgba(150,168,219,.16);border-radius:22px;background-position:center 40%!important;box-shadow:0 22px 60px rgba(0,0,0,.25),0 0 42px rgba(93,87,223,.09)}
.hero::before{background:linear-gradient(90deg,rgba(5,9,19,.94) 0%,rgba(5,9,19,.72) 42%,rgba(5,9,19,.1) 100%),linear-gradient(0deg,rgba(5,9,19,.5),transparent 65%)}
.hin{padding:clamp(22px,4vw,42px);max-width:650px}.hin small{display:inline-flex;align-items:center;gap:7px;background:rgba(104,91,229,.25);border:1px solid rgba(175,164,255,.28);padding:5px 11px;border-radius:99px;color:#d4ceff}.hin h2{font-size:clamp(2rem,5vw,3.4rem);text-shadow:0 4px 24px #000;letter-spacing:-.04em}.hin p{max-width:520px;font-size:1.03rem;line-height:1.75;color:#e0e6f7}.dots{right:22px;bottom:22px}.dots button{width:8px;height:8px}.dots button[aria-current="true"]{width:25px;border-radius:99px;background:#a99bff}
.types{gap:12px;margin-bottom:32px}.tile{background:linear-gradient(145deg,rgba(25,37,62,.94),rgba(14,22,39,.96));border-color:#293957;border-radius:15px;padding:16px;transition:transform .18s,border-color .18s}.tile:hover{transform:translateY(-3px);border-color:#8577ff}.tile b{font-size:.98rem}.tile span{display:block;margin-top:4px;color:#9eabc6}
.sec{margin:8px 0 16px;align-items:center}.sec h3{font-family:"Noto Sans",sans-serif;font-size:1.16rem;font-weight:700;border-left:3px solid #8b7aff;padding-left:12px}.link{color:#b2a8ff}
.grid{grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:22px 16px;margin-bottom:34px}.card{min-width:0}.poster{aspect-ratio:2/2.8;border-radius:14px;padding:13px;background-position:center!important;background-size:cover!important;border:1px solid rgba(177,190,228,.16);box-shadow:0 9px 22px rgba(0,0,0,.22),inset 0 -90px 60px -24px rgba(0,0,0,.83);font-size:1.04rem;text-shadow:0 2px 8px rgba(0,0,0,.9)}.poster::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,8,17,.02) 30%,rgba(4,8,17,.18) 52%,rgba(4,8,17,.88));pointer-events:none}.poster>*{z-index:1}.badge{background:rgba(12,16,30,.72);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(8px);font-size:.68rem}.card .m{margin-top:9px;padding:0 2px}.card .m b{font-size:.91rem;line-height:1.4}.card .m span{font-size:.78rem;color:#98a6c2}.card:hover .poster{transform:translateY(-4px) scale(1.015);box-shadow:0 16px 30px rgba(0,0,0,.38),0 0 20px rgba(120,104,255,.12),inset 0 -90px 60px -24px rgba(0,0,0,.83)}
.chips{gap:9px;padding-bottom:15px}.chip{background:#121d31;border-color:#2b3a59;color:#c2cce2}.chip[aria-pressed="true"],.chip:hover{background:#695de0;border-color:#8176ff;color:white}
.in{background:#111a2b;border-color:#2d3b59;border-radius:12px}.rank{background:linear-gradient(135deg,#171e3d,#111a2b);border-color:#2d3b60;border-radius:17px}.rank h3{color:#b4a9ff}
.det{gap:26px}.det>.poster{min-height:290px}.det h2{letter-spacing:-.035em}.meta{color:#a4b0ca}.chl button:hover{background:rgba(120,110,255,.08)}
dialog{background:#0a1020} .dbar{background:rgba(17,26,43,.96);backdrop-filter:blur(14px);border-bottom-color:#2b3958}
footer{border-top-color:#202c44;color:#8190ad}
@media(min-width:900px){.grid{grid-template-columns:repeat(auto-fill,minmax(155px,1fr))}.hero{min-height:390px}}
@media(max-width:560px){.top{gap:8px}.logo{font-size:1.1rem}nav{width:100%;order:3;overflow-x:auto;flex-wrap:nowrap;padding-bottom:2px}nav button{white-space:nowrap}.hero{min-height:330px;margin-top:14px;border-radius:17px;background-position:58% center!important}.hero::before{background:linear-gradient(0deg,rgba(5,9,19,.96),rgba(5,9,19,.52) 65%,rgba(5,9,19,.16))}.hin{padding:20px}.hin h2{font-size:2rem}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 12px}.poster{border-radius:12px;padding:10px;font-size:.95rem}.types{grid-template-columns:repeat(2,minmax(0,1fr))}.det{grid-template-columns:115px 1fr;gap:15px}.det>.poster{min-height:170px}.det h2{font-size:1.35rem}}

</style>
</head>
<body>
<header><div class="wrap top">
<button class="logo" id="logo">Зохиолын<b>булан</b></button>
<nav id="nav" aria-label="Цэс"></nav>
<button class="btn" id="theme" aria-label="Өнгө солих">◐</button>
</div></header>
<main class="wrap" id="main"></main>
<footer id="foot">Зохиол нэмэх, засах эрх зөвхөн админд олгогдоно.</footer>

<dialog id="rd" aria-label="Уншигч">
<div class="dbar"><button class="btn" id="rClose">Хаах</button><span class="sp" id="rTitle"></span>
<button class="btn" id="fm" aria-label="Жижиг">А−</button><button class="btn" id="fp" aria-label="Том">А+</button></div>
<article class="read" id="rBody"></article></dialog>

<dialog id="adm" aria-label="Админ">
<div class="dbar"><button class="btn" id="aClose">Хаах</button><span class="sp"><b>Админ самбар</b></span></div>
<div class="admin">
<div class="stat-g" id="stats"></div>
<fieldset><legend id="fh">Шинэ бүтээл бүртгэх</legend>
<label>Гарчиг<input id="fT" maxlength="80"></label>
<div style="display:flex;gap:10px;flex-wrap:wrap">
<label style="flex:1;min-width:120px">Төрөл<select id="fY"><option>Веб зохиол</option><option>Аудио ном</option><option>Манхуа</option><option>Драма</option><option>Кино</option></select></label>
<label style="flex:1;min-width:120px">Төлөв<select id="fS"><option>Үргэлжилж буй</option><option>Дууссан</option></select></label>
<label style="flex:1;min-width:120px">Нийтлэл<select id="fP"><option value="0">Нийтлэгдсэн</option><option value="1">Ноорог</option></select></label>
<label style="width:80px">Өнгө<input id="fC" type="color" value="#2a4d9b"></label></div>
<label>Ангилал (таслалаар тусгаарла)<input id="fK" placeholder="Адал явдалт, Уран зөгнөлт"></label>
<label>Товч тайлбар<textarea id="fD" style="min-height:70px"></textarea></label>
<label>Хавтасны зураг <span id="iN"></span><input id="fI" type="file" accept="image/*"></label>
<label>Видео эсвэл аудио файл (mp4, webm) <span id="mN"></span><input id="fM" type="file" accept="video/mp4,video/webm"></label>
<label class="chk"><input id="fF" type="checkbox">Нүүрний онцлох хэсэгт гаргах</label>
<label>Бүлгүүд<textarea id="fX" placeholder="# 1-р бүлэг&#10;Текст...&#10;&#10;# 2-р бүлэг&#10;..."></textarea></label>
<p class="note">Бүлгийг «# Бүлгийн нэр» мөрөөр эхлүүлнэ. Догол мөрийг хоосон мөрөөр тусгаарлана.</p>
<div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn pri" id="fSave">Хадгалах</button><button class="btn" id="fReset">Цэвэрлэх</button><button class="btn" id="seed" hidden>Жишээ бүтээл оруулах</button></div></fieldset>
<fieldset><legend>Шинэ бүлэг нэмэх</legend>
<label>Бүтээл<select id="fQ"></select></label><label>Бүлгийн нэр<input id="fQT"></label><label>Текст<textarea id="fQX" style="min-height:110px"></textarea></label>
<div><button class="btn pri" id="fQA">Бүлэг нэмэх</button></div></fieldset>
<p class="msg" id="msg" role="status"></p>
<fieldset><legend>Бүртгэлтэй бүтээлүүд</legend><input class="in" id="fL" type="search" placeholder="Нэрээр хайх" aria-label="Хайх"><div id="list"></div></fieldset>
</div></dialog>

<script>
const TYPES=["Веб зохиол","Аудио ном","Манхуа","Драма","Кино"];
const SAMPLES=[
{title:"Цаст оргилын захиа",type:"Веб зохиол",status:"Үргэлжилж буй",cats:["Адал явдалт","Уран зөгнөлт"],color:"#2a4d9b",desc:"Хангайн бэлд өссөн залуу эртний захиаг олж, алдагдсан хаант улсын нууцыг мөшгөн аян замд гарна.",text:"# 1-р бүлэг: Захиа\nӨглөө эрт тэнгэр цэлмэж, уулын оройд анхны гэрэл тусав. Тэмүүжин хонио хашаанд оруулж байтал хад чулууны завсраас шар цаасны өлгий олов.\n\nЭнэ бол өвөөгийнх нь хэзээ ч ярьж байгаагүй нууцын эхлэл байлаа.\n\n# 2-р бүлэг: Зам\nТэр ганц морь, хоёр шуудай хуурай чанамлаар аян замд гарлаа. Салхи нуруу руу нь түлхэж байх шиг санагдана.\n\n# 3-р бүлэг: Хошуу\nХошууны эргэн тойронд цас хайлж, голын мөс хагарах чимээ шөнөжин сонсогдов."},
{title:"Шөнийн шуудан",type:"Веб зохиол",status:"Дууссан",cats:["Романтик","Инээдэм"],color:"#8c3d52",desc:"Шөнийн ээлжинд ажилладаг шуудан зөөгч охин, буруу хаягаар ирсэн захидлын эзэнтэй танилцана.",text:"# 1-р бүлэг\nНэгдүгээр сарын хамгийн хүйтэн шөнө, Сарнай буруу хаягтай нэг ширхэг захидал олж харлаа.\n\n# 2-р бүлэг\nТэр захидлыг буцаахын оронд өөрийн гараар хариу бичихээр шийджээ."},
{title:"Говийн сэтгэл",type:"Аудио ном",status:"Үргэлжилж буй",cats:["Ер бусын"],color:"#b0692b",desc:"Говийн нэгэн өвгөний ярьсан домгуудыг чөлөөт өгүүлэмжээр цуглуулсан сонсдог ном.",text:"# 1-р хэсэг\nЭлсний дуу гэж бий. Ганц шөнө тэнгэр цэлмэх тэр цагт хэн ч сонсож чадна.\n\n# 2-р хэсэг\nӨвгөн нэг удаа ч хэнд ч худлаа ярьж байгаагүй гэдэг."},
{title:"Бороотой хотын нууц",type:"Драма",status:"Дууссан",cats:["Ер бусын","Романтик"],color:"#2d6a5c",desc:"Бороо орох бүрт нэг хүн алга болдог хотод ганц мөрдөгч үнэнийг хайна.",text:"# 1-р анги\nБороо дөрөв дэх өдрөө үргэлжилж байлаа. Мөрдөгч Билгүүн цонхоор гудамж ширтэв.\n\n# 2-р анги\nАлга болсон хүмүүсийн нэр нэг тойрог дээр байсныг тэр шөнө олж харав."},
{title:"Тэнгэрийн хаалга",type:"Манхуа",status:"Үргэлжилж буй",cats:["Тулаант","Уран зөгнөлт"],color:"#5a3d96",desc:"Долоон хаалгыг нээсэн хүн л тэнгэрт хүрнэ. Гэтэл нэг хаалга бүр нэг амь авдаг.",text:"# 1-р бүлэг\nЭхний хаалга хүнд байлаа. Төмөр хүйтэн гарт нь наалдав.\n\n# 2-р бүлэг\nХоёр дахь хаалганы цаана хэн нэгэн түүнийг хүлээж байв."},
{title:"Сүүлчийн галт тэрэг",type:"Кино",status:"Дууссан",cats:["Адал явдалт"],color:"#33415c",desc:"Шөнө дундын галт тэргэнд таарсан дөрвөн танихгүй хүний нэг шөнийн түүх.",text:"# Үйл явдал\nГалт тэрэг хөдлөхөөс таван минутын өмнө тэр сүүлчийн тасалбараа авлаа."}];
const COVER_IMAGES=[
 "https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=900&q=85",
 "https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?auto=format&fit=crop&w=900&q=85",
 "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=900&q=85",
 "https://images.unsplash.com/photo-1519608487953-e999c86e7455?auto=format&fit=crop&w=900&q=85",
 "https://images.unsplash.com/photo-1518837695005-2083093ee35b?auto=format&fit=crop&w=900&q=85",
 "https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?auto=format&fit=crop&w=900&q=85"
];
SAMPLES.forEach((w,i)=>{if(!w.img)w.img=COVER_IMAGES[i%COVER_IMAGES.length]});
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let works=SAMPLES.map((w,i)=>({...w,id:"s"+i,createdAt:10-i})),fromDb=false,col=null,isAdmin=false;
let view="home",cur=null,ci=0,fs=18,slide=0,editId=null,F={type:"",cat:"",q:"",sort:"new"},timer=null;
const ls=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
let lib=ls("lib",[]),prog=ls("prog",{});
const save=()=>{try{localStorage.setItem("lib",JSON.stringify(lib));localStorage.setItem("prog",JSON.stringify(prog))}catch(e){}};
const chs=t=>{const o=[];let h="",b=[];String(t||"").split("\n").forEach(l=>{if(l.startsWith("# ")){if(h||b.join("").trim())o.push([h,b.join("\n").trim()]);h=l.slice(2).trim();b=[]}else b.push(l)});if(h||b.join("").trim())o.push([h,b.join("\n").trim()]);return o.length?o:[["",""]]};
const W=()=>works.filter(w=>!w.draft||isAdmin);
const byNew=a=>[...a].sort((x,y)=>(y.createdAt||0)-(x.createdAt||0));
const imgSrc=v=>/^https?:\/\//i.test(String(v||""))||String(v||"").startsWith("data:")?String(v):"/_blob/"+String(v||"");
const poster=(w,x="")=>`<div class="poster" style="background:${w.img?`url(&quot;${esc(imgSrc(w.img))}&quot;) center/cover`: `linear-gradient(160deg,${esc(w.color)},#0b1020)`}">${x}<span class="badge">${esc(w.type)}</span>${esc(w.title)}</div>`;
const card=w=>`<button class="card" data-id="${esc(w.id)}">${poster(w)}<div class="m"><b>${esc(w.title)}</b><span>${chs(w.text).length} бүлэг · ${esc(w.status)}</span></div></button>`;
const doneCount=()=>Object.values(prog).reduce((n,p)=>n+(p.done||[]).length,0);
const RANKS=[[0,"Шавь"],[5,"Багш"],[15,"Их багш"],[40,"Тулааны Хаан"],[100,"Тулааны Эзэн-хаан"],[250,"Гэгээнтэн"]];
function rank(){const n=doneCount();let i=0;RANKS.forEach((r,k)=>{if(n>=r[0])i=k});const nx=RANKS[i+1];return{n,name:RANKS[i][1],next:nx,pct:nx?Math.round((n-RANKS[i][0])/(nx[0]-RANKS[i][0])*100):100}}

function nav(){
 const it=[["home","Нүүр"],["browse","Бүх бүтээл"],["lib","Миний сан"]];if(isAdmin)it.push(["admin","Админ"]);
 $("#nav").innerHTML=it.map(([k,l])=>`<button data-v="${k}" ${k===view||(k==="browse"&&view==="detail")?'aria-current="page"':""}>${l}</button>`).join("");
}
function go(v,id){clearInterval(timer);view=v;if(id)cur=works.find(w=>w.id===id);draw();scrollTo(0,0)}
function draw(){nav();({home,browse,lib:library,detail})[view]();}

function home(){
 clearInterval(timer);
 const n=byNew(W()),fe=n.filter(w=>w.featured),hs=(fe.length?fe:n).slice(0,3);slide=slide%Math.max(hs.length,1);const h=hs[slide];
 const cats=[...new Set(W().flatMap(w=>w.cats||[]))];
 $("#main").innerHTML=(h?`<section class="hero" style="background:${h.img?`url("${esc(imgSrc(h.img))}") center/cover`:`linear-gradient(150deg,${esc(h.color)},#0b1020)`}"><div class="hin"><small>Онцлох · ${esc(h.type)}</small><h2>${esc(h.title)}</h2><p>${esc(h.desc)}</p><button class="btn pri" data-open="${esc(h.id)}">Дэлгэрэнгүй</button></div><div class="dots">${hs.map((_,i)=>`<button data-s="${i}" aria-label="${i+1}" aria-current="${i===slide}"></button>`).join("")}</div></section>`:"")+
 `<div class="types">${TYPES.map(t=>`<button class="tile" data-t="${t}"><b>${t}</b><span>${W().filter(w=>w.type===t).length} бүтээл</span></button>`).join("")}</div>
 <div class="sec"><h3>Сүүлд нэмэгдсэн</h3><button class="link" data-v="browse">Бүгдийг үзэх</button></div><div class="grid">${n.slice(0,8).map(card).join("")}</div>
 <div class="sec"><h3>Түгээмэл ангилал</h3></div><div class="chips">${cats.map(c=>`<button class="chip" data-c="${esc(c)}"># ${esc(c)}</button>`).join("")}</div>`;
 if(hs.length>1)timer=setInterval(()=>{slide++;home()},7000);
}
function browse(){
 const cats=[...new Set(W().flatMap(w=>w.cats||[]))];
 let l=W().filter(w=>(!F.type||w.type===F.type)&&(!F.cat||(w.cats||[]).includes(F.cat))&&(w.title+w.desc).toLowerCase().includes(F.q.toLowerCase()));
 l=F.sort==="az"?l.sort((a,b)=>a.title.localeCompare(b.title,"mn")):byNew(l);
 $("#main").innerHTML=`<div class="bar2"><input class="in" id="q" type="search" placeholder="Нэрээр хайх" value="${esc(F.q)}" aria-label="Хайх"><select class="in" id="so" style="flex:none;min-width:0" aria-label="Эрэмбэ"><option value="new" ${F.sort==="new"?"selected":""}>Шинэ нь эхэнд</option><option value="az" ${F.sort==="az"?"selected":""}>А–Я</option></select></div>
 <div class="chips">${["",...TYPES].map(t=>`<button class="chip" data-t="${t}" aria-pressed="${F.type===t}">${t||"Бүгд"}</button>`).join("")}</div>
 <div class="chips">${cats.map(c=>`<button class="chip" data-c="${esc(c)}" aria-pressed="${F.cat===c}"># ${esc(c)}</button>`).join("")}</div>
 <div class="grid">${l.length?l.map(card).join(""):'<p class="empty">Тохирох бүтээл олдсонгүй. Шүүлтүүрээ цэвэрлээд үзнэ үү.</p>'}</div>`;
}
function library(){
 const r=rank(),l=W().filter(w=>lib.includes(w.id));
 const rec=W().filter(w=>prog[w.id]&&prog[w.id].last!=null);
 $("#main").innerHTML=`<div class="rank"><small style="color:var(--muted)">Таны зэрэг</small><h3 style="font-size:1.6rem">${r.name}</h3><p class="note">${r.n} бүлэг уншсан${r.next?` · дараагийн зэрэг «${r.next[1]}» хүртэл ${r.next[0]-r.n} бүлэг`:""}</p><div class="meter"><i style="width:${r.pct}%"></i></div></div>
 ${rec.length?`<div class="sec"><h3>Үргэлжлүүлэх</h3></div><div class="grid">${rec.map(card).join("")}</div>`:""}
 <div class="sec"><h3>Хадгалсан</h3></div><div class="grid">${l.length?l.map(card).join(""):'<p class="empty">Хадгалсан бүтээл алга. Бүтээлийн хуудсан дээрх «Санд нэмэх» товчийг дарна уу.</p>'}</div>`;
}
function detail(){
 const w=cur;if(!w)return go("home");const c=chs(w.text),p=prog[w.id]||{done:[]};
 $("#main").innerHTML=`<div class="det">${poster(w)}<div><h2>${esc(w.title)}</h2><p class="meta">${esc(w.type)} · ${esc(w.status)} · ${c.length} бүлэг</p><p>${esc(w.desc)}</p>${w.media?`<video controls preload="none" src="/_blob/${esc(w.media)}" style="width:100%;max-width:560px;border-radius:10px"></video>`:""}<p>${(w.cats||[]).map(k=>`<button class="chip" data-c="${esc(k)}"># ${esc(k)}</button>`).join(" ")}</p>
 <div class="row"><button class="btn pri" data-read="${p.last??0}">${p.last!=null?"Үргэлжлүүлэх":"Унших"}</button><button class="btn" id="tl">${lib.includes(w.id)?"Сангаас хасах":"Санд нэмэх"}</button></div></div></div>
 <div class="sec"><h3>Бүлгүүд</h3></div><div class="chl">${c.map((x,i)=>`<button data-read="${i}" class="${i===p.last?"last":(p.done||[]).includes(i)?"done":""}"><span>${esc(x[0]||"Бүлэг "+(i+1))}</span><span>${(p.done||[]).includes(i)?"✓":""}</span></button>`).join("")}</div>`;
}
function read(i){
 const c=chs(cur.text);ci=Math.min(Math.max(i,0),c.length-1);const [h,t]=c[ci];
 const p=prog[cur.id]||(prog[cur.id]={done:[]});p.last=ci;if(!p.done.includes(ci))p.done.push(ci);save();
 $("#rTitle").textContent=cur.title+" · "+(ci+1)+"/"+c.length;$("#rBody").style.fontSize=fs+"px";
 $("#rBody").innerHTML=`<h3>${esc(h||"Бүлэг "+(ci+1))}</h3>`+t.split(/\n\s*\n/).map(x=>`<p>${esc(x).replace(/\n/g,"<br>")}</p>`).join("")+`<div class="pager"><button class="btn" data-n="-1" ${ci===0?"disabled":""}>Өмнөх</button><button class="btn pri" data-n="1" ${ci>=c.length-1?"disabled":""}>Дараах</button></div>`;
 if(!$("#rd").open)$("#rd").showModal();$("#rd").scrollTop=0;
}
document.addEventListener("click",e=>{
 const t=e.target.closest("button");if(!t)return;const d=t.dataset;
 if(t.id==="logo")go("home");
 else if(d.v==="admin"){renderList();$("#adm").showModal()}
 else if(d.v)go(d.v);
 else if(d.id)go("detail",d.id);
 else if(d.open)go("detail",d.open);
 else if(d.s!==undefined){slide=+d.s;home()}
 else if(d.t!==undefined){F.type=d.t===F.type&&view==="browse"?"":d.t;if(view==="browse")F.cat=F.cat;go("browse")}
 else if(d.c!==undefined){F.cat=F.cat===d.c&&view==="browse"?"":d.c;go("browse")}
 else if(d.read!==undefined)read(+d.read);
 else if(d.n)read(ci+ +d.n);
 else if(t.id==="tl"){lib=lib.includes(cur.id)?lib.filter(x=>x!==cur.id):[...lib,cur.id];save();detail()}
 else if(t.id==="rClose"){$("#rd").close();if(view==="detail")detail()}
 else if(t.id==="fm"){fs=Math.max(14,fs-2);read(ci)}
 else if(t.id==="fp"){fs=Math.min(28,fs+2);read(ci)}
 else if(t.id==="theme"){const r=document.documentElement;r.dataset.theme=r.dataset.theme==="dark"?"light":"dark"}
 else if(t.id==="aClose")$("#adm").close();
});
document.addEventListener("input",e=>{if(e.target.id==="q"){F.q=e.target.value;const p=e.target.selectionStart;browse();const q=$("#q");q.focus();q.setSelectionRange(p,p)}if(e.target.id==="so"){F.sort=e.target.value;browse()}});

/* Admin */
const say=t=>$("#msg").textContent=t;
let img="",media="";
const upl=async f=>{const a=await claude.use("assets");if(!a)throw new Error("Файл оруулах эрх алга");return (await a.upload(f)).id};
function resetForm(){editId=null;img=media="";["fT","fK","fD","fX"].forEach(i=>$("#"+i).value="");$("#fY").value=TYPES[0];$("#fS").selectedIndex=0;$("#fP").selectedIndex=0;$("#fC").value="#2a4d9b";$("#fF").checked=false;$("#fI").value="";$("#fM").value="";$("#iN").textContent=$("#mN").textContent="";$("#fh").textContent="Шинэ бүтээл бүртгэх";say("")}
$("#fI").onchange=async e=>{const f=e.target.files[0];if(!f)return;say("Зураг илгээж байна...");try{img=await upl(f);$("#iN").textContent="✓ орсон";say("")}catch(x){say("Зураг оруулж чадсангүй: "+(x.message||""))}};
$("#fM").onchange=async e=>{const f=e.target.files[0];if(!f)return;say("Файл илгээж байна...");try{media=await upl(f);$("#mN").textContent="✓ орсон";say("")}catch(x){say("Файл оруулж чадсангүй: "+(x.message||""))}};
function renderList(){
 const ok=fromDb,cn=ok?works.reduce((n,w)=>n+chs(w.text).length,0):0;
 $("#stats").innerHTML=[["Бүтээл",ok?works.length:0],["Бүлэг",cn],["Нийтлэгдсэн",ok?works.filter(w=>!w.draft).length:0],["Ноорог",ok?works.filter(w=>w.draft).length:0]].map(([a,b])=>`<div class="stat"><b>${b}</b><span>${a}</span></div>`).join("");
 $("#seed").hidden=!(col&&!fromDb);
 const q=$("#fL").value.toLowerCase(),L=ok?works.filter(w=>w.title.toLowerCase().includes(q)):[],sv=$("#fQ").value;
 $("#fQ").innerHTML=(ok?works:[]).map(w=>`<option value="${esc(w.id)}">${esc(w.title)}</option>`).join("");$("#fQ").value=sv;
 $("#list").innerHTML=L.length?L.map(w=>`<div class="item"><span><b>${esc(w.title)}</b>${w.featured?" ★":""}${w.draft?" (ноорог)":""}<br><span class="note">${esc(w.type)} · ${chs(w.text).length} бүлэг</span></span><span class="acts"><button class="btn" data-f="${esc(w.id)}">${w.featured?"Онцлохоос хасах":"Онцлох"}</button><button class="btn" data-p="${esc(w.id)}">${w.draft?"Нийтлэх":"Ноорог болгох"}</button><button class="btn" data-e="${esc(w.id)}">Засах</button><button class="btn del" data-d="${esc(w.id)}">Устгах</button></span></div>`).join(""):'<p class="note">Бүртгэлтэй бүтээл олдсонгүй.</p>';
}
$("#fL").oninput=renderList;$("#fReset").onclick=resetForm;
$("#fSave").onclick=async()=>{
 if(!col)return say("Өгөгдлийн сантай холбогдоогүй байна.");
 const d={title:$("#fT").value.trim(),type:$("#fY").value,status:$("#fS").value,color:$("#fC").value,cats:$("#fK").value.split(",").map(s=>s.trim()).filter(Boolean),desc:$("#fD").value.trim(),text:$("#fX").value,img,media,featured:$("#fF").checked,draft:$("#fP").value==="1"};
 if(!d.title||!d.text.trim())return say("Гарчиг болон бүлгийн текстийг заавал бөглөнө үү.");
 try{editId?await col.doc(editId).update(d):await col.doc("w"+Date.now().toString(36)).set({...d,createdAt:Date.now()});resetForm();say("Хадгалагдлаа.")}catch(e){say("Хадгалж чадсангүй: "+(e&&e.message||"алдаа"))}
};
$("#fQA").onclick=async()=>{
 const id=$("#fQ").value,t=$("#fQT").value.trim(),x=$("#fQX").value.trim(),w=works.find(z=>z.id===id);
 if(!col||!w||!t||!x)return say("Бүтээл сонгож, бүлгийн нэр болон текстийг бөглөнө үү.");
 try{await col.doc(id).update({text:String(w.text||"").replace(/\s+$/,"")+"\n\n# "+t+"\n"+x});$("#fQT").value=$("#fQX").value="";say("Бүлэг нэмэгдлээ.")}catch(e){say("Нэмж чадсангүй.")}
};
$("#list").onclick=async e=>{
 const {e:a,d:b,f,p}=e.target.dataset,id=a||b||f||p;if(!id)return;const w=works.find(x=>x.id===id);
 try{
  if(f)await col.doc(id).update({featured:!w.featured});
  else if(p)await col.doc(id).update({draft:!w.draft});
  else if(a){editId=a;img=w.img||"";media=w.media||"";$("#fT").value=w.title;$("#fY").value=w.type;$("#fS").value=w.status;$("#fP").value=w.draft?"1":"0";$("#fC").value=w.color;$("#fK").value=(w.cats||[]).join(", ");$("#fD").value=w.desc||"";$("#fX").value=w.text;$("#fF").checked=!!w.featured;$("#iN").textContent=img?"✓ орсон":"";$("#mN").textContent=media?"✓ орсон":"";$("#fh").textContent="Бүтээл засах";$("#adm").scrollTop=0}
  else if(b&&confirm("Энэ бүтээлийг устгах уу?")){await col.doc(id).delete();say("Устгагдлаа.")}
 }catch(x){say("Үйлдэл амжилтгүй боллоо.")}
};
$("#seed").onclick=async()=>{try{for(let i=0;i<SAMPLES.length;i++)await col.doc("w"+i).set({...SAMPLES[i],createdAt:Date.now()-i*1000});say("Жишээ бүтээл орлоо.")}catch(e){say("Оруулж чадсангүй.")}};

document.documentElement.dataset.theme="dark";
draw();
(async()=>{
 try{
  const u=await claude.use("user");isAdmin=!!(u&&u.canEdit&&u.canEdit());
  if(isAdmin)$("#foot").textContent="Та админ эрхээр нэвтэрсэн байна.";nav();draw();
  const db=await claude.use("db");
  if(db){col=db.collection("works");col.onSnapshot(s=>{const a=s.docs.map(d=>({id:d.id,...d.data()}));fromDb=a.length>0;works=fromDb?a:SAMPLES.map((w,i)=>({...w,id:"s"+i,createdAt:10-i}));if(cur)cur=works.find(w=>w.id===cur.id)||cur;if(!$("#rd").open)draw();renderList()},()=>{})}
 }catch(e){}
})();
</script>
</body>
</html>
